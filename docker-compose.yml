services:
  # Database
  postgres:
    image: postgres:14-alpine
    container_name: msmebazaar-postgres
    environment:
      POSTGRES_DB: msmebazaar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - msmebazaar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: msmebazaar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - msmebazaar-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msmebazaar-api-gateway
    ports:
      - "7000:7000"
    environment:
      - NODE_ENV=production
      - PORT=7000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      # Service URLs for inter-service communication
      - AUTH_SERVICE_URL=http://auth-service:8004
      - PAYMENT_SERVICE_URL=http://payment-service:8017
      - BUYER_SERVICE_URL=http://buyer-service:8023
      - SELLER_SERVICE_URL=http://seller-service:8024
      - LOAN_SERVICE_URL=http://loan-service:8028
      - NOTIFICATION_SERVICE_URL=http://notification-service:8009
      - ADMIN_SERVICE_URL=http://admin-service:8009
      - SUPERADMIN_SERVICE_URL=http://superadmin-service:8025
      - INVESTOR_SERVICE_URL=http://investor-service:8026
      - AGENT_SERVICE_URL=http://agent-service:8027
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - msmebazaar-network
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msmebazaar-auth-service
    ports:
      - "8004:8004"
    environment:
      - NODE_ENV=production
      - PORT=8004
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - msmebazaar-network
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msmebazaar-payment-service
    ports:
      - "8017:8017"
    environment:
      - NODE_ENV=production
      - PORT=8017
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - msmebazaar-network
    restart: unless-stopped

  # Loan Service
  loan-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msmebazaar-loan-service
    ports:
      - "8028:8028"
    environment:
      - NODE_ENV=production
      - PORT=8028
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - msmebazaar-network
    restart: unless-stopped

  # Buyer Service
  buyer-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msmebazaar-buyer-service
    ports:
      - "8023:8023"
    environment:
      - NODE_ENV=production
      - PORT=8023
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - msmebazaar-network
    restart: unless-stopped

  # Seller Service
  seller-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msmebazaar-seller-service
    ports:
      - "8024:8024"
    environment:
      - NODE_ENV=production
      - PORT=8024
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - msmebazaar-network
    restart: unless-stopped

  # Admin Service
  admin-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msmebazaar-admin-service
    ports:
      - "8009:8009"
    environment:
      - NODE_ENV=production
      - PORT=8009
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - msmebazaar-network
    restart: unless-stopped

  # Superadmin Service
  superadmin-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msmebazaar-superadmin-service
    ports:
      - "8025:8025"
    environment:
      - NODE_ENV=production
      - PORT=8010
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - msmebazaar-network
    restart: unless-stopped

  # Investor Service
  investor-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msmebazaar-investor-service
    ports:
      - "8026:8026"
    environment:
      - NODE_ENV=production
      - PORT=8011
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - msmebazaar-network
    restart: unless-stopped

  # Agent Service
  agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msmebazaar-agent-service
    ports:
      - "8027:8027"
    environment:
      - NODE_ENV=production
      - PORT=8012
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - msmebazaar-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: msmebazaar-notification-service
    ports:
      - "8008:8008"
    environment:
      - NODE_ENV=production
      - PORT=8008
      - DATABASE_URL=${DATABASE_URL}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - msmebazaar-network
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msmebazaar-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api-gateway:7000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - api-gateway
    networks:
      - msmebazaar-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: msmebazaar-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - api-gateway
    networks:
      - msmebazaar-network
    restart: unless-stopped

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: msmebazaar-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - msmebazaar-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: msmebazaar-grafana
    ports:
      - "3007:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - msmebazaar-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  msmebazaar-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
